[project]
name = "anything-to-skill"
version = "0.0.1"
description = "Transforma um corpus de fontes numa skill de Claude Code de alta fidelidade e rastreavel."
requires-python = ">=3.11"
dependencies = ["networkx", "pymupdf", "markdownify"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["anything_to_skill*"]

[tool.setuptools.package-data]
anything_to_skill = ["references/*.md", "templates/*.md"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
